{% extends 'layouts/base_limpa.html' %}

{% block titulo_aba %}Entrar{% endblock %}

{% block conteudo %}
  <div class="card">
    <div class="card-body p-4">
      <h1 class="h2 mb-4">Tem de Tudo - Instrumentos</h1>

      <form action="{{ url_for('login') }}" method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="mb-3">
          <label for="email" class="form-label">E-mail</label>
          <input type="email" class="form-control" id="email" name="email" value="{{ email }}" required autofocus autocomplete="username">
        </div>

        <div class="mb-3">
          <label for="senha" class="form-label">Senha</label>
          <input type="password" class="form-control" id="senha" name="senha" required autocomplete="current-password">
        </div>
            <button type="submit" class="btn btn-dark w-100">
                <i class="bi bi-check-circle"></i> Entrar
            </button>

      </form>
    </div>
  </div>
{% endblock %}
